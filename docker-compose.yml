name: office-ai

x-app-service: &app-service
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  networks:
    - private

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  frontend:
    <<: *app-service
    build:
      context: ./frontend
    image: office-ai-frontend:local
    user: "10001:10001"
    working_dir: /app
    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0",
        "--configLoader",
        "runner",
      ]
    environment:
      VITE_API_BASE_URL: ${OFFICE_AI_API_BASE_URL:-http://localhost:9999/api/v1}
    ports:
      - "${OFFICE_AI_FRONTEND_PORT:-8888}:5173"
    read_only: true
    tmpfs:
      - /tmp
      - /app/dist
    networks:
      - edge
      - private
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  storage-init:
    build:
      context: ./backend
    image: office-ai-backend:local
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "chown 10001:10001 /app/files /app/parsed /app/evidence /app/work && chmod 0750 /app/files /app/parsed /app/evidence /app/work",
      ]
    restart: "no"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    volumes:
      - app-files:/app/files
      - parsed-files:/app/parsed
      - evidence-files:/app/evidence
      - shared-work:/app/work

  backend:
    <<: *app-service
    build:
      context: ./backend
    image: office-ai-backend:local
    user: "10001:10001"
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OFFICE_AI_ENV: ${OFFICE_AI_ENV:-local}
      OFFICE_AI_LOG_LEVEL: ${OFFICE_AI_LOG_LEVEL:-INFO}
      OFFICE_AI_FRONTEND_ORIGIN: ${OFFICE_AI_FRONTEND_ORIGIN:-http://localhost:8888}
      OFFICE_AI_MYSQL_DATABASE: ${OFFICE_AI_MYSQL_DATABASE:-office_ai}
      OFFICE_AI_MYSQL_USER: ${OFFICE_AI_MYSQL_USER:-office_ai}
      OFFICE_AI_MYSQL_PASSWORD: ${OFFICE_AI_MYSQL_PASSWORD:-local-dev-change-me}
      OFFICE_AI_DATABASE_HOST: mysql
      OFFICE_AI_DATABASE_PORT: "3306"
      OFFICE_AI_REDIS_URL: redis://redis:6379/0
      OFFICE_AI_SESSION_SECRET: ${OFFICE_AI_SESSION_SECRET:-}
      OFFICE_AI_ACCESS_TOKEN_TTL_SECONDS: ${OFFICE_AI_ACCESS_TOKEN_TTL_SECONDS:-900}
      OFFICE_AI_REFRESH_TOKEN_TTL_SECONDS: ${OFFICE_AI_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      OFFICE_AI_BOOTSTRAP_ADMIN_PHONE: ${OFFICE_AI_BOOTSTRAP_ADMIN_PHONE:-}
      OFFICE_AI_BOOTSTRAP_ADMIN_PASSWORD: ${OFFICE_AI_BOOTSTRAP_ADMIN_PASSWORD:-}
      OFFICE_AI_FILES_ROOT: /app/files
      OFFICE_AI_PARSED_ROOT: /app/parsed
      OFFICE_AI_EVIDENCE_ROOT: /app/evidence
      OFFICE_AI_MAX_FILE_BYTES: ${OFFICE_AI_MAX_FILE_BYTES:-52428800}
      OFFICE_AI_MAX_IMAGE_BYTES: ${OFFICE_AI_MAX_IMAGE_BYTES:-20971520}
      OFFICE_AI_MAX_IMAGE_DECODED_BYTES: ${OFFICE_AI_MAX_IMAGE_DECODED_BYTES:-134217728}
      OFFICE_AI_MAX_TASK_FILES: ${OFFICE_AI_MAX_TASK_FILES:-20}
      OFFICE_AI_MAX_TASK_BYTES: ${OFFICE_AI_MAX_TASK_BYTES:-209715200}
      OFFICE_AI_MASTER_KEY: ${OFFICE_AI_MASTER_KEY:-}
      OFFICE_AI_TASK_TIMEOUT_SECONDS: ${OFFICE_AI_TASK_TIMEOUT_SECONDS:-2700}
      OFFICE_AI_CHAT_MAX_INPUT_CHARS: ${OFFICE_AI_CHAT_MAX_INPUT_CHARS:-32768}
      OFFICE_AI_CHAT_MAX_OUTPUT_TOKENS: ${OFFICE_AI_CHAT_MAX_OUTPUT_TOKENS:-8192}
      OFFICE_AI_CHAT_STREAM_TIMEOUT_SECONDS: ${OFFICE_AI_CHAT_STREAM_TIMEOUT_SECONDS:-180}
      OFFICE_AI_CHAT_HEARTBEAT_SECONDS: ${OFFICE_AI_CHAT_HEARTBEAT_SECONDS:-15}
      OFFICE_AI_CHAT_MAX_ACTIVE_RUNS_PER_USER: ${OFFICE_AI_CHAT_MAX_ACTIVE_RUNS_PER_USER:-1}
      OFFICE_AI_CHAT_RUNS_PER_HOUR: ${OFFICE_AI_CHAT_RUNS_PER_HOUR:-20}
      OFFICE_AI_CHAT_RUNS_PER_DAY: ${OFFICE_AI_CHAT_RUNS_PER_DAY:-100}
      OFFICE_AI_CHAT_THREAD_RETENTION_DAYS: ${OFFICE_AI_CHAT_THREAD_RETENTION_DAYS:-365}
      OFFICE_AI_CHAT_SOFT_DELETE_GRACE_DAYS: ${OFFICE_AI_CHAT_SOFT_DELETE_GRACE_DAYS:-30}
      OFFICE_AI_CHAT_BACKUP_RETENTION_DAYS: ${OFFICE_AI_CHAT_BACKUP_RETENTION_DAYS:-30}
      OFFICE_AI_CHAT_PURGE_SLA_HOURS: ${OFFICE_AI_CHAT_PURGE_SLA_HOURS:-24}
      OFFICE_AI_CHAT_EXPORT_MAX_BYTES: ${OFFICE_AI_CHAT_EXPORT_MAX_BYTES:-10485760}
      OFFICE_AI_DECK_MAX_SLIDES: ${OFFICE_AI_DECK_MAX_SLIDES:-40}
      OFFICE_AI_DECK_MAX_CONTEXT_ASSETS: ${OFFICE_AI_DECK_MAX_CONTEXT_ASSETS:-20}
      OFFICE_AI_CHAT_FILE_CONTEXT_MODE: ${OFFICE_AI_CHAT_FILE_CONTEXT_MODE:-deck_only}
      OFFICE_AI_CHAT_THINKING_DEFAULT_ENABLED: ${OFFICE_AI_CHAT_THINKING_DEFAULT_ENABLED:-false}
      OFFICE_AI_CHAT_WEB_SEARCH_ENABLED: ${OFFICE_AI_CHAT_WEB_SEARCH_ENABLED:-false}
      OFFICE_AI_PPT_RENDERER_URL: http://ppt-renderer:3000
      OFFICE_AI_LIBREOFFICE_URL: http://libreoffice:8081
      OFFICE_AI_LIBREOFFICE_TIMEOUT_SECONDS: ${OFFICE_AI_LIBREOFFICE_TIMEOUT_SECONDS:-120}
      OFFICE_AI_RENDERED_ROOT: /app/rendered
      OFFICE_AI_PPT_RENDERER_TIMEOUT_SECONDS: ${OFFICE_AI_PPT_RENDERER_TIMEOUT_SECONDS:-120}
      OFFICE_AI_MAX_PRESENTATION_REQUEST_BYTES: ${OFFICE_AI_MAX_PRESENTATION_REQUEST_BYTES:-10485760}
    ports:
      - "${OFFICE_AI_BACKEND_PORT:-9999}:8000"
    volumes:
      - app-files:/app/files
      - parsed-files:/app/parsed
      - evidence-files:/app/evidence
      - type: volume
        source: shared-work
        target: /app/rendered
        read_only: true
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./frontend:/frontend:ro
      - ./ppt-renderer:/ppt-renderer:ro
      - ./backend/libreoffice-service:/backend/libreoffice-service:ro
      - ./backend/ocr-service:/backend/ocr-service:ro
      - ./backend/app:/backend/app:ro
      - ./backend/pyproject.toml:/backend/pyproject.toml:ro
      - ./golden-data/inputs:/golden-data/inputs:ro
      - ./golden-data/expected:/golden-data/expected:ro
      - ./golden-data/manifests:/golden-data/manifests:ro
      - ./docs:/docs:ro
    tmpfs:
      - /tmp
    networks:
      - edge
      - private
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ppt-renderer:
        condition: service_healthy
      libreoffice:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]

  worker:
    <<: *app-service
    build:
      context: ./backend
    image: office-ai-backend:local
    user: "10001:10001"
    working_dir: /app
    command: ["python", "-m", "app.workers.asset_processing"]
    read_only: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    environment:
      OFFICE_AI_ENV: ${OFFICE_AI_ENV:-local}
      OFFICE_AI_LOG_LEVEL: ${OFFICE_AI_LOG_LEVEL:-INFO}
      OFFICE_AI_MYSQL_DATABASE: ${OFFICE_AI_MYSQL_DATABASE:-office_ai}
      OFFICE_AI_MYSQL_USER: ${OFFICE_AI_MYSQL_USER:-office_ai}
      OFFICE_AI_MYSQL_PASSWORD: ${OFFICE_AI_MYSQL_PASSWORD:-local-dev-change-me}
      OFFICE_AI_DATABASE_HOST: mysql
      OFFICE_AI_REDIS_URL: redis://redis:6379/0
      OFFICE_AI_FILES_ROOT: /app/files
      OFFICE_AI_PARSED_ROOT: /app/parsed
      OFFICE_AI_MAX_FILE_BYTES: ${OFFICE_AI_MAX_FILE_BYTES:-52428800}
      OFFICE_AI_MAX_IMAGE_BYTES: ${OFFICE_AI_MAX_IMAGE_BYTES:-20971520}
      OFFICE_AI_MAX_IMAGE_DECODED_BYTES: ${OFFICE_AI_MAX_IMAGE_DECODED_BYTES:-134217728}
      OFFICE_AI_MAX_TASK_FILES: ${OFFICE_AI_MAX_TASK_FILES:-20}
      OFFICE_AI_MAX_TASK_BYTES: ${OFFICE_AI_MAX_TASK_BYTES:-209715200}
      OFFICE_AI_MAX_PARSED_OUTPUT_BYTES: ${OFFICE_AI_MAX_PARSED_OUTPUT_BYTES:-10485760}
      OFFICE_AI_MAX_PDF_PAGES: ${OFFICE_AI_MAX_PDF_PAGES:-200}
      OFFICE_AI_MAX_EXCEL_SHEETS: ${OFFICE_AI_MAX_EXCEL_SHEETS:-100}
      OFFICE_AI_MAX_EXCEL_NON_EMPTY_CELLS: ${OFFICE_AI_MAX_EXCEL_NON_EMPTY_CELLS:-300000}
      OFFICE_AI_MAX_ARCHIVE_ENTRIES: ${OFFICE_AI_MAX_ARCHIVE_ENTRIES:-10000}
      OFFICE_AI_MAX_ARCHIVE_UNCOMPRESSED_BYTES: ${OFFICE_AI_MAX_ARCHIVE_UNCOMPRESSED_BYTES:-262144000}
      OFFICE_AI_MAX_ARCHIVE_COMPRESSION_RATIO: ${OFFICE_AI_MAX_ARCHIVE_COMPRESSION_RATIO:-100}
      OFFICE_AI_MAX_OFFICE_XML_MEMBER_BYTES: ${OFFICE_AI_MAX_OFFICE_XML_MEMBER_BYTES:-16777216}
      OFFICE_AI_MAX_PARSER_STRUCTURAL_ITEMS: ${OFFICE_AI_MAX_PARSER_STRUCTURAL_ITEMS:-1500000}
      OFFICE_AI_PARSER_TIMEOUT_SECONDS: ${OFFICE_AI_PARSER_TIMEOUT_SECONDS:-30}
      OFFICE_AI_PROCESSING_LEASE_SECONDS: ${OFFICE_AI_PROCESSING_LEASE_SECONDS:-300}
      OFFICE_AI_CLAMAV_HOST: clamav
      OFFICE_AI_CLAMAV_PORT: "3310"
      OFFICE_AI_CLAMAV_TIMEOUT_SECONDS: ${OFFICE_AI_CLAMAV_TIMEOUT_SECONDS:-30}
      OFFICE_AI_PADDLEOCR_URL: http://paddleocr:8080
      OFFICE_AI_OCR_TIMEOUT_SECONDS: ${OFFICE_AI_OCR_TIMEOUT_SECONDS:-60}
      OFFICE_AI_MAX_OCR_RESPONSE_BYTES: ${OFFICE_AI_MAX_OCR_RESPONSE_BYTES:-10485760}
      OFFICE_AI_MAX_OCR_ITEMS: ${OFFICE_AI_MAX_OCR_ITEMS:-5000}
      OFFICE_AI_EVIDENCE_ROOT: /app/evidence
      OFFICE_AI_MAX_EVIDENCE_MANIFEST_BYTES: ${OFFICE_AI_MAX_EVIDENCE_MANIFEST_BYTES:-10485760}
      OFFICE_AI_MAX_EVIDENCE_ITEMS: ${OFFICE_AI_MAX_EVIDENCE_ITEMS:-11563}
      OFFICE_AI_OCR_RETRY_LIMIT: ${OFFICE_AI_OCR_RETRY_LIMIT:-3}
      OFFICE_AI_OCR_RETRY_BACKOFF_SECONDS: ${OFFICE_AI_OCR_RETRY_BACKOFF_SECONDS:-30}
    volumes:
      - type: volume
        source: app-files
        target: /app/files
        read_only: true
      - type: volume
        source: parsed-files
        target: /app/parsed
        read_only: false
      - type: volume
        source: evidence-files
        target: /app/evidence
        read_only: false
    tmpfs:
      - /tmp
    depends_on:
      storage-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      paddleocr:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import app.workers.asset_processing"]

  workflow-worker:
    <<: *app-service
    build:
      context: ./backend
    image: office-ai-backend:local
    user: "10001:10001"
    working_dir: /app
    command: ["python", "-m", "app.workers.workflow"]
    read_only: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    environment:
      OFFICE_AI_ENV: ${OFFICE_AI_ENV:-local}
      OFFICE_AI_LOG_LEVEL: ${OFFICE_AI_LOG_LEVEL:-INFO}
      OFFICE_AI_MYSQL_DATABASE: ${OFFICE_AI_MYSQL_DATABASE:-office_ai}
      OFFICE_AI_MYSQL_USER: ${OFFICE_AI_MYSQL_USER:-office_ai}
      OFFICE_AI_MYSQL_PASSWORD: ${OFFICE_AI_MYSQL_PASSWORD:-local-dev-change-me}
      OFFICE_AI_DATABASE_HOST: mysql
      OFFICE_AI_REDIS_URL: redis://redis:6379/0
      OFFICE_AI_MASTER_KEY: ${OFFICE_AI_MASTER_KEY:-}
      OFFICE_AI_EVIDENCE_ROOT: /app/evidence
      OFFICE_AI_MAX_EVIDENCE_MANIFEST_BYTES: ${OFFICE_AI_MAX_EVIDENCE_MANIFEST_BYTES:-10485760}
    volumes:
      - type: volume
        source: evidence-files
        target: /app/evidence
        read_only: true
    tmpfs:
      - /tmp
    networks:
      - edge
      - private
    depends_on:
      storage-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import app.workers.workflow"]

  generation-worker:
    <<: *app-service
    build:
      context: ./backend
    image: office-ai-backend:local
    user: "10001:10001"
    working_dir: /app
    command: ["python", "-m", "app.workers.generation"]
    read_only: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    environment:
      OFFICE_AI_ENV: ${OFFICE_AI_ENV:-local}
      OFFICE_AI_LOG_LEVEL: ${OFFICE_AI_LOG_LEVEL:-INFO}
      OFFICE_AI_MYSQL_DATABASE: ${OFFICE_AI_MYSQL_DATABASE:-office_ai}
      OFFICE_AI_MYSQL_USER: ${OFFICE_AI_MYSQL_USER:-office_ai}
      OFFICE_AI_MYSQL_PASSWORD: ${OFFICE_AI_MYSQL_PASSWORD:-local-dev-change-me}
      OFFICE_AI_DATABASE_HOST: mysql
      OFFICE_AI_REDIS_URL: redis://redis:6379/0
      OFFICE_AI_FILES_ROOT: /app/files
      OFFICE_AI_EVIDENCE_ROOT: /app/evidence
      OFFICE_AI_MAX_EVIDENCE_MANIFEST_BYTES: ${OFFICE_AI_MAX_EVIDENCE_MANIFEST_BYTES:-10485760}
      OFFICE_AI_PPT_RENDERER_URL: http://ppt-renderer:3000
      OFFICE_AI_LIBREOFFICE_URL: http://libreoffice:8081
      OFFICE_AI_LIBREOFFICE_TIMEOUT_SECONDS: ${OFFICE_AI_LIBREOFFICE_TIMEOUT_SECONDS:-120}
      OFFICE_AI_RENDERED_ROOT: /app/rendered
      OFFICE_AI_PPT_RENDERER_TIMEOUT_SECONDS: ${OFFICE_AI_PPT_RENDERER_TIMEOUT_SECONDS:-120}
      OFFICE_AI_MAX_PRESENTATION_REQUEST_BYTES: ${OFFICE_AI_MAX_PRESENTATION_REQUEST_BYTES:-10485760}
      OFFICE_AI_TASK_TIMEOUT_SECONDS: ${OFFICE_AI_TASK_TIMEOUT_SECONDS:-2700}
    volumes:
      - type: volume
        source: app-files
        target: /app/files
        read_only: false
      - type: volume
        source: shared-work
        target: /app/rendered
        read_only: true
      - type: volume
        source: evidence-files
        target: /app/evidence
        read_only: true
    tmpfs:
      - /tmp
    networks:
      - private
    depends_on:
      storage-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ppt-renderer:
        condition: service_healthy
      libreoffice:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import app.workers.generation.runner"]

  ppt-renderer:
    <<: *app-service
    build:
      context: ./ppt-renderer
      target: build
    image: office-ai-ppt-renderer:local
    user: "10001:10001"
    working_dir: /app
    command: ["node", "dist/server.js"]
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      NODE_ENV: ${OFFICE_AI_ENV:-local}
      PORT: "3000"
      WORK_ROOT: /app/work
      PPT_RENDERER_BUILD_OUT_DIR: /tmp/ppt-renderer-dist
      MAX_REQUEST_BYTES: ${OFFICE_AI_MAX_PRESENTATION_REQUEST_BYTES:-10485760}
    volumes:
      - shared-work:/app/work
      - ./golden-data/inputs:/golden-data/inputs:ro
      - ./golden-data/expected:/golden-data/expected:ro
      - ./golden-data/manifests:/golden-data/manifests:ro
    tmpfs:
      - /tmp
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  mysql:
    <<: *app-service
    image: mysql:8.4.5
    user: "999:999"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${OFFICE_AI_MYSQL_DATABASE:-office_ai}
      MYSQL_USER: ${OFFICE_AI_MYSQL_USER:-office_ai}
      MYSQL_PASSWORD: ${OFFICE_AI_MYSQL_PASSWORD:-local-dev-change-me}
      MYSQL_ROOT_PASSWORD: ${OFFICE_AI_MYSQL_ROOT_PASSWORD:-local-dev-root-change-me}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]

  redis:
    <<: *app-service
    image: redis:7.4.5-alpine
    user: "999:999"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  clamav:
    <<: *app-service
    image: clamav/clamav:1.4.5
    init: false
    user: "100:101"
    entrypoint: ["/sbin/tini", "--"]
    command: ["clamd", "--foreground"]
    read_only: true
    tmpfs:
      - /run/clamav:uid=100,gid=101,mode=0750
      - /tmp:uid=100,gid=101,mode=0750
      - /var/log/clamav:uid=100,gid=101,mode=0750
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      <<: *healthcheck
      start_period: 120s
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]

  paddleocr:
    <<: *app-service
    build:
      context: ./backend
      dockerfile: ocr-service/Dockerfile
    image: office-ai-paddleocr:local
    user: "10001:10001"
    command: ["python", "-m", "app.services.ocr.server"]
    read_only: true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    environment:
      HOME: /opt/paddle-home
      PADDLE_OCR_BASE_DIR: /opt/paddle-home/.paddleocr
      PADDLE_PDX_CACHE_HOME: /opt/paddle-home/.paddlex
      PADDLE_PDX_MODEL_SOURCE: BOS
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OFFICE_AI_MAX_IMAGE_BYTES: ${OFFICE_AI_MAX_IMAGE_BYTES:-20971520}
      OFFICE_AI_MAX_OCR_ITEMS: ${OFFICE_AI_MAX_OCR_ITEMS:-5000}
    tmpfs:
      - /tmp
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]

  libreoffice:
    <<: *app-service
    build:
      context: ./backend
      dockerfile: libreoffice-service/Dockerfile
    image: office-ai-libreoffice:local
    user: "10001:10001"
    command: ["python", "-m", "app.services.quality.presentation.server"]
    read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    environment:
      OFFICE_AI_FILES_ROOT: /app/files
      OFFICE_AI_QUALITY_WORK_ROOT: /app/work
      OFFICE_AI_LIBREOFFICE_TIMEOUT_SECONDS: ${OFFICE_AI_LIBREOFFICE_TIMEOUT_SECONDS:-120}
    volumes:
      - app-files:/app/files:ro
      - shared-work:/app/work
    tmpfs:
      - /tmp
    networks:
      - private
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  app-files:
  parsed-files:
  evidence-files:
  shared-work:
  mysql-data:
  redis-data:
  clamav-data:
